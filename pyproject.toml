[project]
name = "network-anomaly-platform"
version = "0.1.0"
description = "A scalable, PCAP-first anomaly detection platform for IT and OT network traffic."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Network Analytics Team" }]
dependencies = [
    "joblib>=1.4.2",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "plotly>=5.24.1",
    "psutil>=6.0.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.2",
    "pyyaml>=6.0.2",
    "rich>=13.7.1",
    "scapy>=2.5.0",
    "scikit-learn>=1.5.1",
    "streamlit>=1.40.0",
    "torch>=2.4.0",
    "typer>=0.12.3",
]

[project.scripts]
anomaly = "anomdet.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomdet"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
